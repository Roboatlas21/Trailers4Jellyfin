name: Publish Release

on:
  workflow_dispatch:
  push:
    branches:
      - feat/internal-cinema-mode-assets
    paths:
      - build.yaml
    tags:
      - 'v*.*.*.*'

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate release version
        id: version
        run: |
          python3 - <<'PY'
          import os
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          project = ET.parse('Jellyfin.Plugin.Trailers4Jellyfin/Jellyfin.Plugin.Trailers4Jellyfin.csproj')
          version = project.findtext('.//AssemblyVersion')
          assert re.fullmatch(r'\d+\.\d+\.\d+\.\d+', version), 'Invalid plugin version'
          assert project.findtext('.//FileVersion') == version, 'File version mismatch'
          assert f'version: {version}' in Path('build.yaml').read_text().splitlines(), 'Build version mismatch'
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == f'v{version}', 'Tag version mismatch'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'VERSION={version}', file=output)
          PY

      - name: Test
        run: dotnet test Jellyfin.Plugin.Trailers4Jellyfin.Tests/Jellyfin.Plugin.Trailers4Jellyfin.Tests.csproj --configuration Release -warnaserror

      - name: Build
        run: |
          dotnet publish \
            Jellyfin.Plugin.Trailers4Jellyfin/Jellyfin.Plugin.Trailers4Jellyfin.csproj \
            --configuration Release --output bin -warnaserror

      - name: Package
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          # Jellyfin supplies the server assemblies; YoutubeExplode is our only private dependency.
          zip -j "trailers4jellyfin_${RELEASE_VERSION}.zip" \
            bin/Jellyfin.Plugin.Trailers4Jellyfin.dll bin/YoutubeExplode.dll

      - name: Prepare catalog entry
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          pip install pyyaml --quiet
          # Preserve catalog history from main while using this release's script and build metadata.
          git fetch origin main
          git show origin/main:manifest.json > manifest.json
          CHECKSUM=$(md5sum "trailers4jellyfin_${RELEASE_VERSION}.zip" | cut -d' ' -f1)
          python3 update_manifest.py "$RELEASE_VERSION" "$CHECKSUM"
          cp manifest.json "$RUNNER_TEMP/trailers4jellyfin-manifest.json"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Trailers4Jellyfin ${{ steps.version.outputs.VERSION }}
          files: trailers4jellyfin_${{ steps.version.outputs.VERSION }}.zip
          fail_on_unmatched_files: true

      - name: Publish catalog on main
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          # Only advertise the update after its ZIP has been published successfully.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git restore manifest.json
          git checkout -B catalog-update origin/main
          cp "$RUNNER_TEMP/trailers4jellyfin-manifest.json" manifest.json
          git add manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish plugin catalog version ${RELEASE_VERSION}"
            git push origin HEAD:main
          fi
